services:
  backend:
    image: eink-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      # ---- Pydantic Settings (canonical names read by backend/app/config.py) ----
      - DEBUG=False

      # JWT secret. Provide ONE of:
      #   JWT_SECRET_KEY      — the secret value itself (set in your .env)
      #   JWT_SECRET_KEY_FILE — path inside the container to a file holding it
      # If JWT_SECRET_KEY is unset, docker-entrypoint.sh generates the file
      # below on first run, so a fresh deployment needs no secret configured.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_SECRET_KEY_FILE=/app/backend/data/users/jwt_secret.txt
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}  # 30 days

      # Password reset token validity (minutes).
      - PASSWORD_RESET_TTL_MINUTES=${PASSWORD_RESET_TTL_MINUTES:-60}

      # ---- Legacy os.getenv-style EINK_* vars still read by active code ----
      # einkpdf core profile loader and workspaces.py rely on these directly.
      - EINK_DATA_DIR=/app/backend/data
      - EINK_PROFILE_DIR=/app/config/profiles
      - EINK_CLEANUP_TTL_DAYS=${EINK_CLEANUP_TTL_DAYS:-14}
      # - EINK_CLEANUP_MAX_TEMPLATES=500

      # Password-reset link sent in emails. Override PASSWORD_RESET_URL in your
      # .env to point at the public domain you serve the frontend from.
      - EINK_PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://localhost:3000/reset-password}

      # ---- EmailService (SMTP) ----
      # Leave SMTP host empty to fall back to file-based delivery (writes .eml
      # files under EINK_EMAIL_OUTPUT_DIR). Set the SMTP_* vars in your .env
      # to send for real.
      - EINK_EMAIL_OUTPUT_DIR=/app/backend/data/emails
      - EINK_SMTP_HOST=${EINK_SMTP_HOST:-}
      - EINK_SMTP_PORT=${EINK_SMTP_PORT:-587}
      - EINK_SMTP_USERNAME=${EINK_SMTP_USERNAME:-}
      - EINK_SMTP_PASSWORD=${EINK_SMTP_PASSWORD:-}
      - EINK_SMTP_FROM=${EINK_SMTP_FROM:-}
      - EINK_SMTP_USE_TLS=${EINK_SMTP_USE_TLS:-true}
    volumes:
      # Persistent backend data (SQLite DB, uploaded assets, JWT secret file,
      # email .eml drops). Override DATA_DIR in your .env to point elsewhere
      # — e.g. a NAS mount — without editing this file.
      - ${DATA_DIR:-./data}:/app/backend/data
      # Device profile YAMLs (read-only inside the container).
      - ${PROFILE_DIR:-./config/profiles}:/app/config/profiles:ro
    # Backend isn't published to the host; reach it through the frontend
    # nginx proxy or your reverse proxy of choice.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: eink-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    environment:
      # Same-origin API: the frontend's nginx proxies /api -> http://backend:8000.
      - VITE_API_BASE_URL=/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
